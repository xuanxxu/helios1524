<<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우주선 자가치유 단열재 시뮬레이터</title>
    <style>
        body { font-family: '맑은 고딕', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; max-width: 380px; width: 100%; }
        h2 { margin-top: 0; color: #333; font-size: 1.3em; }
        canvas { border: 3px solid #222; background: #000; border-radius: 6px; cursor: crosshair; touch-action: none; }
        .controls { margin-top: 15px; display: flex; flex-direction: column; gap: 12px; text-align: left; }
        .guide { background: #e9ecef; color: #495057; padding: 10px; border-radius: 6px; font-size: 13px; text-align: center; font-weight: bold; }
        .control-group { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        label { font-weight: bold; color: #555; font-size: 14px; }
        select { padding: 8px; font-size: 14px; border-radius: 4px; border: 1px solid #ddd; flex-grow: 1; }
        button { padding: 10px; font-weight: bold; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 4px; width: 100%; }
        .info-box { background: #f8f9fa; padding: 12px; border-radius: 8px; border: 1px solid #eee; margin-top: 15px; }
        .info-item { margin: 6px 0; display: flex; justify-content: space-between; align-items: center; }
        .info-label { font-weight: bold; color: #666; font-size: 14px; }
        .info-value { font-size: 1.1em; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>우주선 단열재 열전달 시뮬레이터</h2>
        <canvas id="simCanvas" width="350" height="350"></canvas>
        <div class="controls">
            <div class="guide">👉 위쪽 빨간 영역부터 손가락으로 드래그해 구멍을 내보세요!</div>
            <div class="control-group">
                <label for="healSpeed">치유 속도:</label>
                <select id="healSpeed">
                    <option value="0">치유 안 됨 (일반 단열재)</option>
                    <option value="0.02">천천히 치유</option>
                    <option value="0.08" selected>빠르게 치유 (신소재)</option>
                </select>
            </div>
            <button id="resetBtn">시뮬레이션 초기화</button>
        </div>
        <div class="info-box">
            <div class="info-item">
                <span class="info-label">상단 표면 온도:</span>
                <span class="info-value" style="color:red;">1500 ℃</span>
            </div>
            <div class="info-item">
                <span class="info-label">우주선 내부 온도:</span>
                <span id="internalTemp" class="info-value" style="color:blue;">20.0 ℃</span>
            </div>
            <div class="info-item">
                <span class="info-label">상태:</span>
                <span id="statusText" style="font-weight:bold; color:#28a745;">정상 단열 중</span>
            </div>
        </div>
    </div>

    <script>
        const GRID_SIZE = 50, canvas = document.getElementById('simCanvas'), ctx = canvas.getContext('2d'), cellSize = canvas.width / GRID_SIZE;
        const BASE_K = 0.015, CRACK_K = 0.4, DT = 0.15;
        let gridT = Array.from({ length: GRID_SIZE }, () => new Float32Array(GRID_SIZE).fill(20));
        let gridK = Array.from({ length: GRID_SIZE }, () => new Float32Array(GRID_SIZE).fill(BASE_K));
        let gridDamage = Array.from({ length: GRID_SIZE }, () => new Uint8Array(GRID_SIZE).fill(0));
        let isTouching = false;

        function initGrid() {
            for (let r = 0; r < GRID_SIZE; r++) {
                gridT[r].fill(20); if (r === 0) gridT[r].fill(1500);
                gridK[r].fill(BASE_K); gridDamage[r].fill(0);
            }
        }

        function damageAtPos(x, y) {
            const rect = canvas.getBoundingClientRect();
            const c = Math.floor((x - rect.left) / cellSize);
            const r = Math.floor((y - rect.top) / cellSize);
            for (let dr = -2; dr <= 2; dr++) {
                for (let dc = -2; dc <= 2; dc++) {
                    let nr = r + dr, nc = c + dc;
                    if (nr > 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
                        gridDamage[nr][nc] = 1;
                        gridK[nr][nc] = CRACK_K;
                    }
                }
            }
        }

        // 마우스 및 터치 이벤트 처리
        canvas.addEventListener('mousedown', (e) => { isTouching = true; damageAtPos(e.clientX, e.clientY); });
        canvas.addEventListener('mousemove', (e) => { if(isTouching) damageAtPos(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => isTouching = false);

        canvas.addEventListener('touchstart', (e) => { isTouching = true; damageAtPos(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); });
        canvas.addEventListener('touchmove', (e) => { if(isTouching) damageAtPos(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); });
        window.addEventListener('touchend', () => isTouching = false);

        document.getElementById('resetBtn').addEventListener('click', initGrid);

        function tempToColor(t) {
            let norm = Math.min(Math.max((t - 20) / 1480, 0), 1);
            return `hsl(${(1 - norm) * 240}, 100%, 50%)`;
        }

        function loop() {
            const lambda = parseFloat(document.getElementById('healSpeed').value);
            let nextT = gridT.map(row => new Float32Array(row)), hasDamage = false;

            for (let r = 1; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (r === 0) { gridT[r][c] = 1500; continue; }
                    if (gridDamage[r][c] === 1) {
                        hasDamage = true;
                        if (lambda > 0) {
                            gridK[r][c] -= (gridK[r][c] - BASE_K) * lambda;
                            if (gridK[r][c] <= BASE_K + 0.002) { gridK[r][c] = BASE_K; gridDamage[r][c] = 0; }
                        if (nr > 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
}
                    }
                    let left = (c > 0) ? gridT[r][c - 1] : gridT[r][c];
                    let right = (c < GRID_SIZE - 1) ? gridT[r][c + 1] : gridT[r][c];
                    let top = gridT[r - 1][c];
                    let bottom = (r < GRID_SIZE - 1) ? gridT[r + 1][c] : gridT[r][c];
                    
                    nextT[r][c] = gridT[r][c] + gridK[r][c] * (left + right + top + bottom - 4 * gridT[r][c]) * DT;
                }
            }
            gridT = nextT;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    ctx.fillStyle = tempToColor(gridT[r][c]);
                    ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
                    if (gridDamage[r][c] === 1) {
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                        ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
                    }
                }
            }

            // 우주선 내부 온도 연산 (하단 평균)
            let sumTemp = 0;
            for (let r = GRID_SIZE - 3; r < GRID_SIZE; r++) for (let c = 0; c < GRID_SIZE; c++) sumTemp += gridT[r][c];
            const avgTemp = (sumTemp / (GRID_SIZE * 3)).toFixed(1);
            const tempEl = document.getElementById('internalTemp');
            tempEl.innerText = `${avgTemp} ℃`;
            tempEl.style.color = avgTemp > 200 ? 'red' : (avgTemp > 80 ? 'orange' : 'blue');

            const statusEl = document.getElementById('statusText');
            if (hasDamage) {
                statusEl.innerText = lambda > 0 ? "손상 발생! 치유 중..." : "손상 발생! (치유 안 됨 - 위험)";
                statusEl.style.color = lambda > 0 ? "orange" : "red";
            } else {
                statusEl.innerText = "정상 단열 중";
                statusEl.style.color = "#28a745";
            }

            requestAnimationFrame(loop);
        }
        initGrid(); loop();
    </script>
</body>
</html>
